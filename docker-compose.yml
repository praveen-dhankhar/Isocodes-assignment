# Local Postgres 16: `customs` for the app, `customs_test` for integration tests.
# Local-only credentials; production uses Supabase (ap-south-1).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: customs
    ports:
      - "5433:5432" # 5433 on the host: avoids clashing with a locally installed Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    configs:
      - source: create-test-db
        target: /docker-entrypoint-initdb.d/create-test-db.sql

configs:
  create-test-db:
    content: CREATE DATABASE customs_test;

volumes:
  pgdata:
